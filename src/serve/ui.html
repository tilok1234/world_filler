<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Director Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23141720'/%3E%3Crect x='5' y='5' width='6' height='6' transform='rotate(45 8 8)' fill='%236ac1ff'/%3E%3C/svg%3E">
<style>
:root{
  --bg0:#0e1014; --bg1:#14171d; --bg2:#191d24; --bg3:#20252e;
  --line:#272d38; --line2:#323a47;
  --ink:#d8dde6; --mut:#8a93a3; --dim:#5b6472;
  --acc:#6ac1ff; --accdim:#3a6d92;
  --amber:#e8b45a; --green:#7bd88f; --red:#ff7d7d; --gold:#ffd166;
  --boss:#ff7d9d; --dun:#6ac1ff;
  --mono:ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace;
  --sans:system-ui,'Segoe UI',sans-serif;
}
*{box-sizing:border-box} 
html,body{height:100%}
body{margin:0;background:var(--bg0);color:var(--ink);font:13px/1.45 var(--sans);
  display:grid;grid-template-columns:250px 1fr 392px;overflow:hidden}
a{color:var(--acc);text-decoration:none} a:hover{color:#9ed7ff;text-decoration:underline}
h1,h2,h3{margin:0;font-weight:600}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.scroll::-webkit-scrollbar{width:9px}
.scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:2px solid var(--bg1)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.hidden{display:none!important}

/* ---------- buttons, chips, inputs ---------- */
.btn{background:var(--bg3);border:1px solid var(--line2);border-radius:5px;padding:5px 12px;
  cursor:pointer;transition:border-color .1s,background .1s;user-select:none;white-space:nowrap}
.btn:hover{border-color:#465163;background:#252b36}
.btn.primary{background:#1c4664;border-color:#2d6b97;color:#cfeaff;font-weight:600}
.btn.primary:hover{background:#215579;border-color:#3d84b8}
.btn.small{padding:2px 8px;font-size:12px;border-radius:4px}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}
body.busy .verb{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:9px;
  font-size:11px;font-family:var(--mono);background:var(--bg3);border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:2px;flex:none}
.chip.pass{color:#9fe3ae;border-color:#2c5237;background:#16261c}
.chip.warn{color:#ecc98d;border-color:#635028;background:#2a2314}
.chip.fail{color:#ffa0a0;border-color:#6b3232;background:#2d1717}
.chip.acc{color:#9ed7ff;border-color:#2d5c80;background:#132430}
.chip.gold{color:#ffe1a1;border-color:#6b5a2a;background:#2b2412}
input[type=text],input[type=number],select,textarea{
  background:#101318;border:1px solid var(--line2);border-radius:4px;color:var(--ink);
  font:12px var(--mono);padding:3px 7px}
input[type=number]{width:76px}
input[type=checkbox]{accent-color:var(--acc)}
input[type=range]{accent-color:var(--acc)}
textarea{width:100%;resize:vertical}
label{user-select:none}

/* ---------- messages ---------- */
.msg{margin-top:6px;padding:6px 9px;border-radius:5px;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}
.msg.bad{background:#2d1416;border:1px solid #6b3232;color:#ffb0b0}
.msg.good{background:#15251b;border:1px solid #2c5237;color:#a9e6b7}
.msg.note{background:#2a2314;border:1px solid #635028;color:#ecc98d}

/* ---------- left rail ---------- */
#rail{background:var(--bg1);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#brand{padding:14px 14px 10px}
#brand h1{font-size:15px;letter-spacing:.4px}
#brand .sub{color:var(--dim);font:11px var(--mono);margin-top:2px}
#modechip{margin:0 14px 10px;font:11px var(--mono);padding:4px 8px;border-radius:5px;display:flex;gap:6px;align-items:center}
#modechip .led{width:7px;height:7px;border-radius:50%;flex:none}
#modechip.live{background:#15251b;border:1px solid #2c5237;color:#a9e6b7}
#modechip.mock{background:#2a2314;border:1px solid #635028;color:#ecc98d}
#railhead{padding:0 14px 5px;color:var(--dim);font:600 10px var(--sans);letter-spacing:1.2px;text-transform:uppercase}
#worlds{flex:1;min-height:0;padding:0 8px 8px}
.world{padding:8px 9px;border-radius:6px;border:1px solid transparent;cursor:pointer;margin-bottom:2px}
.world:hover{background:var(--bg2)}
.world.on{background:#16202b;border-color:#2d5c80}
.world .nm{font:600 13px var(--mono);display:flex;align-items:center;gap:7px}
.world .nm .pend{width:7px;height:7px;border-radius:50%;background:var(--amber);flex:none;
  box-shadow:0 0 6px #e8b45a88}
.world .meta{color:var(--dim);font:11px var(--mono);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font-size:10px;padding:0 5px;border-radius:3px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap;display:inline-block}
.tag.own{color:#ecc98d;border-color:#635028}
.tag.exp{color:#9fe3ae;border-color:#2c5237}
#dock{border-top:1px solid var(--line);padding:12px 14px;background:var(--bg2)}
#dock .row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
#btnDirect{flex:1;padding:9px 12px;font-size:14px;border-radius:6px;position:relative}
#btnDirect .spin{display:none}
body.busy #btnDirect .spin{display:inline-block}
.spin{width:12px;height:12px;border:2px solid #cfeaff44;border-top-color:#cfeaff;border-radius:50%;
  animation:sp .8s linear infinite;vertical-align:-2px;margin-right:7px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
#dock .strict{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:12px}
#directOut .gates{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}

/* ---------- center / map ---------- */
#center{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg0)}
#maphead{display:flex;gap:14px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);
  background:var(--bg1);flex-wrap:wrap}
.seg{display:flex;flex:none;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{background:transparent;border:0;padding:4px 11px;cursor:pointer;color:var(--mut);
  font:12px var(--mono);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:#1c4664;color:#cfeaff}
.ovs{display:flex;gap:11px;align-items:center;color:var(--mut);font-size:12px;flex-wrap:wrap}
.ovs label{display:flex;gap:5px;align-items:center;cursor:pointer}
.ovs label:hover{color:var(--ink)}
#alpha{width:74px}
.legend{margin-left:auto;display:flex;gap:10px;color:var(--dim);font:11px var(--mono);align-items:center}
.legend b{font-weight:400}
#stale{background:#2a2314;border-bottom:1px solid #635028;color:#ecc98d;padding:0 12px;font:12px var(--mono)}
#stale .bar{display:flex;gap:10px;align-items:center;padding:6px 0;flex-wrap:wrap}
#stale ul{margin:0 0 8px;padding-left:20px;color:#d9b97e}
#stale .btn{border-color:#635028;background:#3a3018;color:#ffe1a1}
#stale details summary{cursor:pointer;color:#c7a35e;white-space:nowrap}
#mapwrap{flex:1;position:relative;min-height:0;background:
  repeating-conic-gradient(#101318 0% 25%, #0e1014 0% 50%) 0 0/22px 22px}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;cursor:crosshair}
#cv.panning{cursor:grabbing}
#mapempty{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;
  justify-content:center;background:var(--bg0);text-align:center;padding:30px}
#mapempty .err-line{font:13px var(--mono);color:#ffb0b0;max-width:440px;white-space:pre-wrap}
#mapempty .hint{color:var(--mut);max-width:400px}
#busy{position:absolute;inset:0;background:#0e1014c9;display:flex;flex-direction:column;gap:12px;
  align-items:center;justify-content:center;backdrop-filter:blur(1px)}
#busy .bspin{width:34px;height:34px;border:3px solid #6ac1ff33;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}
#busy .t1{font:600 14px var(--sans)}
#busy .t2{color:var(--mut);font-size:12px}
#mapfoot{display:flex;gap:12px;align-items:center;padding:6px 12px;border-top:1px solid var(--line);
  background:var(--bg1);font:12px var(--mono);color:var(--mut);min-height:30px}
#cursorbar{flex:1;display:flex;gap:8px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cursorbar .cid{color:var(--ink)}
#stamp{color:var(--dim);white-space:nowrap}
.zoomctl{display:flex;gap:2px;align-items:center}
.zoomctl .btn{padding:1px 8px;font-family:var(--mono)}

/* ---------- right panel ---------- */
#side{background:var(--bg1);border-left:1px solid var(--line);min-height:0}
#side section{border-bottom:1px solid var(--line)}
#side .shead{position:sticky;top:0;z-index:3;display:flex;gap:8px;align-items:center;
  padding:9px 14px;background:var(--bg2);border-bottom:1px solid var(--line);
  font:600 10px var(--sans);letter-spacing:1.2px;text-transform:uppercase;color:var(--mut)}
#side details>.shead{cursor:pointer;list-style:none}
#side details>.shead::-webkit-details-marker{display:none}
#side details>.shead:after{content:'▸';margin-left:auto;color:var(--dim);transition:transform .12s}
#side details[open]>.shead:after{transform:rotate(90deg)}
.sbody{padding:12px 14px}
.card h3{font:600 13px var(--mono);word-break:break-all;margin:7px 0 2px;color:#e8edf5}
.chiprow{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:9px 0;font:12px var(--mono)}
.kv .k{color:var(--dim);white-space:nowrap}
.kv .v{color:var(--ink);word-break:break-all;text-align:right}
.kv .v.l{text-align:left}
table.t{border-collapse:collapse;width:100%;font:12px var(--mono);margin:7px 0}
.t th{color:var(--dim);font-weight:400;text-align:left;padding:2px 8px 4px 0;border-bottom:1px solid var(--line)}
.t td{padding:3px 8px 3px 0;border-bottom:1px solid #1d222b;vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t .r{text-align:right;padding-right:0}
.t th.r{padding-right:0}
.t .tot td{border-top:1px solid var(--line2);font-weight:600}
.sent{background:#2b2412;border:1px solid #6b5a2a;border-radius:5px;padding:8px 10px;margin:9px 0;
  color:#ffe1a1;font:12px var(--mono)}
.sent .cap{color:#a08b52;font-family:var(--sans);margin-top:3px}
.funnel{margin:7px 0;font:11px var(--mono);color:var(--mut)}
.funnel .fr{display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:center;margin:2px 0}
.funnel .fbar{height:4px;background:var(--bg3);border-radius:2px;position:relative;overflow:hidden}
.funnel .fbar i{position:absolute;inset:0 auto 0 0;background:var(--accdim);border-radius:2px}
.cands{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.cands .chip{cursor:pointer}
.cands .chip:hover{border-color:var(--acc);color:#9ed7ff}
.actions{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.rowlist{margin:6px 0;display:flex;flex-direction:column;gap:2px}
.rowitem{display:flex;gap:8px;align-items:center;padding:4px 7px;border-radius:5px;cursor:pointer;
  font:12px var(--mono);border:1px solid transparent;min-width:0}
.rowitem:hover{background:var(--bg2);border-color:var(--line2)}
.rowitem .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowitem .sub{color:var(--dim)}
.covbar{position:relative;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;flex:0 0 64px}
.covbar i{position:absolute;inset:0 auto 0 0;background:var(--accdim)}
.covbar b{position:absolute;top:-1px;bottom:-1px;width:1px;background:#ecc98d}
.subh{color:var(--dim);font:600 10px var(--sans);letter-spacing:1.1px;text-transform:uppercase;margin:13px 0 4px}
.hintline{color:var(--dim);font-size:11px;margin-top:8px}
.gaterow{display:flex;gap:8px;align-items:baseline;padding:3px 0;font:12px var(--mono)}
.gaterow .gid{color:var(--dim);flex:0 0 24px}
.gaterow .gnm{flex:1;color:var(--ink)}
.gatedet{margin:0 0 6px 32px;color:#ecc98d;font:11px var(--mono);white-space:pre-wrap;word-break:break-word}
.xbtn{background:none;border:0;color:var(--dim);cursor:pointer;font-size:14px;padding:0 3px;margin-left:auto}
.xbtn:hover{color:var(--ink)}

/* ---------- recipe form ---------- */
.rgrid{display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center;margin:6px 0 2px}
.rgrid label{color:var(--mut);font:12px var(--mono)}
.rgrid input[type=text]{width:150px}
.rgrid select{width:150px}
.enemies{width:100%;border-collapse:collapse;font:11px var(--mono);margin:6px 0}
.enemies th{color:var(--dim);font-weight:400;text-align:left;padding:2px 5px 4px 0}
.enemies td{padding:2px 5px 2px 0}
.enemies input[type=text]{width:100%;padding:2px 5px}
.enemies input[type=number]{width:46px;padding:2px 4px}
.enemies .bio{min-width:110px}
.rfoot{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:12px}
.dirty{color:var(--amber);font:11px var(--mono)}
#rawwrap textarea{height:300px;font-size:11px;line-height:1.5}
</style>
</head>
<body>

<aside id="rail">
  <div id="brand">
    <h1>Director Studio</h1>
    <div class="sub">wf-fill · content director</div>
  </div>
  <div id="modechip"></div>
  <div id="railhead">Worlds</div>
  <div id="worlds" class="scroll"></div>
  <div id="dock">
    <div class="row">
      <label class="strict" title="Fail the run instead of waiving when a gate cannot pass">
        <input type="checkbox" id="strict"> strict
      </label>
      <a id="viewlink" class="hidden" target="_blank">open /view</a>
    </div>
    <div class="row" style="margin-bottom:0">
      <button id="btnDirect" class="btn primary verb"><span class="spin"></span>Direct</button>
    </div>
    <div id="directOut"></div>
  </div>
</aside>

<section id="center">
  <div id="maphead">
    <div class="seg" id="backdropSeg" role="group" aria-label="backdrop"></div>
    <div class="ovs" id="ovs">
      <label><input type="checkbox" data-ov="terr" checked> territories</label>
      <label><input type="checkbox" data-ov="plc" checked> placements</label>
      <label><input type="checkbox" data-ov="arena" checked> arenas</label>
      <label><input type="checkbox" data-ov="excl"> exclusion</label>
      <label title="territory fill opacity">fill <input type="range" id="alpha" min="0" max="90" value="45"></label>
    </div>
    <div class="legend">
      <b><span style="color:var(--boss)">◆</span> boss</b>
      <b><span style="color:var(--dun)">■</span> dungeon</b>
      <b><span style="color:var(--gold)">◆</span> locked</b>
      <span class="zoomctl">
        <button class="btn small" data-zoom="out" title="zoom out">−</button>
        <button class="btn small" data-zoom="fit" title="fit">fit</button>
        <button class="btn small" data-zoom="in" title="zoom in">+</button>
      </span>
    </div>
  </div>
  <div id="stale" class="hidden"></div>
  <div id="mapwrap">
    <canvas id="cv" aria-label="world map"></canvas>
    <div id="mapempty" class="hidden"></div>
    <div id="busy" class="hidden">
      <div class="bspin"></div>
      <div class="t1" id="busyT1">Directing…</div>
      <div class="t2">generation + export — can take a few seconds on big worlds</div>
    </div>
  </div>
  <div id="mapfoot">
    <div id="cursorbar"></div>
    <div id="stamp"></div>
  </div>
</section>

<aside id="side" class="scroll">
  <section>
    <div class="shead">Inspect <span id="inspectCtx" style="margin-left:auto;text-transform:none;letter-spacing:0"></span></div>
    <div class="sbody" id="inspectBody"></div>
  </section>
  <details id="auditSec" open>
    <summary class="shead">Audit</summary>
    <div class="sbody" id="auditBody"></div>
  </details>
  <details id="recipeSec">
    <summary class="shead">Recipe</summary>
    <div class="sbody" id="recipeBody"></div>
  </details>
</aside>

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function hashId(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const OKLCH = typeof CSS !== 'undefined' && CSS.supports && CSS.supports('color', 'oklch(0.7 0.1 200)');
function idColor(id){
  const h = hashId(id), hue = h % 360, l = 0.66 + ((h >>> 9) % 3) * 0.05;
  return OKLCH ? `oklch(${l} 0.14 ${hue})` : `hsl(${hue} 55% ${Math.round(l * 88)}%)`;
}

/* ======================== API layer + demo mock ======================== */
function ApiError(message){ const e = new Error(message); e.isApi = true; return e; }

async function api(method, path, body){
  if (S.mode === 'mock') return mockApi(method, path, body);
  const res = await fetch(path, { method, body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await res.json().catch(() => ({ ok: false, error: 'non-JSON response' }));
  if (!res.ok) throw ApiError(data.error || res.statusText);
  return data;
}

const MOCK = {
  worlds: deep(CAPTURED['GET /api/worlds'].worlds),
  exported: new Set(),
  recipes: {},                        // world -> {own recipe obj}
  locks: {},                          // world -> Set(placementId)
  rerolls: {},                        // world -> Map(regionId -> iteration)
};
const mlocks = (w) => MOCK.locks[w] || (MOCK.locks[w] = new Set());
const mrolls = (w) => MOCK.rerolls[w] || (MOCK.rerolls[w] = new Map());
const delay = (ms) => new Promise((r) => setTimeout(r, ms));

function mockRecipe(w){
  if (MOCK.recipes[w]) return MOCK.recipes[w];
  const base = deep(CAPTURED['GET /api/recipe?world=fen-hollow']);
  base.world = w; return base;
}
function mockOwn(w){ // a verb wrote into this world's recipe → it becomes an own recipe
  const r = mockRecipe(w);
  r.own = true; r.path = `recipes/${w}.json`;
  r.normalized.locks = { placements: [...mlocks(w)].map((id) => ({ id })) };
  r.normalized.rerolls = [...mrolls(w)].map(([regionId, iteration]) => ({ regionId, iteration }));
  r.raw = JSON.stringify(r.normalized, null, 2);
  MOCK.recipes[w] = r;
}
async function mockApi(method, path, body){
  const url = new URL(path, 'http://x');
  const p = url.pathname, q = url.searchParams, w = q.get('world') || (body && body.world);
  if (p === '/api/worlds'){
    return { worlds: MOCK.worlds.map((e) => ({ ...e, hasOwnRecipe: !!MOCK.recipes[e.name] && MOCK.recipes[e.name].own, hasExport: MOCK.exported.has(e.name) })) };
  }
  if (p === '/api/direct'){
    await delay(1500);
    MOCK.exported.add(w);
    const r = deep(CAPTURED['POST /api/direct?world=fen-hollow']);
    r.strict = q.get('strict') === '1';
    return r;
  }
  if (p === '/api/pack'){
    if (!MOCK.exported.has(w)) throw ApiError(`no export for ${w} yet — direct it first`);
    const pack = deep(CAPTURED['GET /api/pack?world=fen-hollow']);
    pack.manifest.world = w;
    const locks = mlocks(w);
    for (const pl of pack.placements.placements) pl.locked = locks.has(pl.id);
    pack.placements.lockReport = [...locks].map((id) => ({ id, status: 'held' }));
    return pack;
  }
  if (p === '/api/recipe' && method === 'GET') return deep(mockRecipe(w));
  if (p === '/api/recipe' && method === 'PUT'){
    const seed = body && body.directorSeed;
    if (seed !== undefined && (!Number.isSafeInteger(seed) || seed < 0))
      throw ApiError('recipe: directorSeed must be a non-negative safe integer');
    const cur = mockRecipe(w);
    MOCK.recipes[w] = { world: w, path: `recipes/${w}.json`, own: true,
      raw: JSON.stringify(body, null, 2), normalized: { ...deep(cur.normalized), ...deep(body) } };
    return { ok: true };
  }
  if (p === '/api/lock'){
    if (!MOCK.exported.has(w)) throw ApiError(`no export for ${w} yet — direct it first`);
    mlocks(w).add(body.placementId); mockOwn(w);
    const src = CAPTURED['GET /api/pack?world=fen-hollow'].placements.placements.find((x) => x.id === body.placementId);
    return { ok: true, locked: src ? { id: src.id, rule: src.rule, regionId: src.regionId, cell: src.cell, exclusionRadius: src.exclusionRadius, anchorPoiId: src.anchorPoiId, arenaOrigin: src.arenaOrigin, arenaSide: src.arenaSide } : { id: body.placementId } };
  }
  if (p === '/api/unlock'){ mlocks(w).delete(body.placementId); mockOwn(w); return { ok: true, released: body.placementId }; }
  if (p === '/api/reroll'){
    const it = (mrolls(w).get(body.regionId) || 0) + 1;
    mrolls(w).set(body.regionId, it); mockOwn(w);
    return { ok: true, regionId: body.regionId, iteration: it };
  }
  throw ApiError('unknown route ' + p);
}

const D = { W: 0, H: 0, terrMap: null, plcMap: null, tColors: {}, terrCv: null, covByRegion: {}, budgeted: [] };
function derivePack(){
  const pk = S.pack; if (!pk) return;
  D.W = pk.manifest.base.width; D.H = pk.manifest.base.height;
  D.terrMap = new Map(); D.plcMap = new Map(); D.tColors = {};
  for (const t of pk.territories.territories){
    D.tColors[t.id] = idColor(t.id);
    for (const [x, y, len] of t.cells.runs)
      for (let i = 0; i < len; i++) D.terrMap.set((y * D.W) + x + i, t.id);
  }
  for (const pl of pk.placements.placements) D.plcMap.set(pl.cell[1] * D.W + pl.cell[0], pl.id);
  const tc = document.createElement('canvas'); tc.width = D.W; tc.height = D.H;
  const g = tc.getContext('2d');
  for (const t of pk.territories.territories){
    g.fillStyle = D.tColors[t.id];
    for (const [x, y, len] of t.cells.runs) g.fillRect(x, y, len, 1);
  }
  D.terrCv = tc;
  D.covByRegion = {};
  for (const c of (pk.territories.coverage?.regions || [])) D.covByRegion[c.regionId] = c;
  D.budgeted = pk.plan.regions.filter((r) => (r.budgets.territories + r.budgets.worldBosses + r.budgets.dungeonBindings + (r.budgets.encounterSites || 0)) > 0);
}

const getReg = (id) => S.pack?.plan.regions.find((r) => r.id === id);
const rerollIter = (rid) => (S.recipe?.normalized?.rerolls || []).find((r) => r.regionId === rid)?.iteration ?? 0;
function recipeLockIds(){ // ids are opaque atoms — accept either bare strings or {id} entries
  const list = S.recipe?.normalized?.locks?.placements || [];
  return new Set(list.map((e) => typeof e === 'string' ? e : e && e.id).filter(Boolean));
}

/* ============================== map =============================== */
const cv = $('cv'), wrap = $('mapwrap');
const IMGS = new Map();
function backdropImg(){
  if (!S.world) return null;
  const key = `${S.world}/${S.backdrop}#${S.gen}`;
  let e = IMGS.get(key);
  if (!e){
    e = { img: new Image(), ready: false };
    e.img.onload = () => { e.ready = true; draw(); };
    e.img.src = renderURL(S.world, S.backdrop);
    IMGS.set(key, e);
  }
  return e;
}
function geo(){
  const r = wrap.getBoundingClientRect();
  const s0 = Math.min(r.width / D.W, r.height / D.H) * 0.97;
  const s = s0 * S.view.m;
  const maxx = Math.max(0, (D.W * s - r.width) / 2 + 60), maxy = Math.max(0, (D.H * s - r.height) / 2 + 60);
  S.view.px = clamp(S.view.px, -maxx, maxx); S.view.py = clamp(S.view.py, -maxy, maxy);
  return { s, s0, ox: (r.width - D.W * s) / 2 + S.view.px, oy: (r.height - D.H * s) / 2 + S.view.py, cw: r.width, ch: r.height };
}
function sizeCanvas(){
  const r = wrap.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  draw();
}
new ResizeObserver(sizeCanvas).observe(wrap);

function draw(){
  const ctx = cv.getContext('2d'), dpr = devicePixelRatio || 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!S.pack) return;
  const v = geo();
  ctx.imageSmoothingEnabled = false;
  const bd = backdropImg();
  if (bd && bd.ready) ctx.drawImage(bd.img, 0, 0, D.W, D.H, v.ox, v.oy, D.W * v.s, D.H * v.s);
  else { ctx.fillStyle = '#161a21'; ctx.fillRect(v.ox, v.oy, D.W * v.s, D.H * v.s);
    ctx.fillStyle = '#5b6472'; ctx.font = '12px ui-monospace,monospace'; ctx.textAlign = 'center';
    ctx.fillText('loading render…', v.ox + D.W * v.s / 2, v.oy + D.H * v.s / 2); ctx.textAlign = 'left'; }
  if (S.ov.terr && D.terrCv){
    ctx.globalAlpha = S.alpha;
    ctx.drawImage(D.terrCv, 0, 0, D.W, D.H, v.ox, v.oy, D.W * v.s, D.H * v.s);
    ctx.globalAlpha = 1;
    const hiId = (S.sel?.t === 'territory' && S.sel.id) || (S.hover?.tid) || null;
    if (hiId){
      const t = getTerr(hiId);
      if (t){
        ctx.globalAlpha = Math.min(0.85, S.alpha + 0.3);
        ctx.fillStyle = D.tColors[t.id];
        for (const [x, y, len] of t.cells.runs)
          ctx.fillRect(v.ox + x * v.s, v.oy + y * v.s, len * v.s, v.s);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = '#ffffffb0'; ctx.lineWidth = 1;
        ctx.strokeRect(v.ox + t.seedCell[0] * v.s, v.oy + t.seedCell[1] * v.s, v.s, v.s);
      }
    }
  }
  const pls = S.pack.placements.placements;
  if (S.ov.arena){
    ctx.strokeStyle = '#ff7d9d'; ctx.lineWidth = 1.5;
    for (const p of pls) if (p.arenaOrigin && p.arenaSide)
      ctx.strokeRect(v.ox + p.arenaOrigin[0] * v.s, v.oy + p.arenaOrigin[1] * v.s, p.arenaSide * v.s, p.arenaSide * v.s);
  }
  if (S.ov.excl){
    ctx.strokeStyle = '#e8b45a99'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
    for (const p of pls){
      ctx.beginPath();
      ctx.arc(v.ox + (p.cell[0] + 0.5) * v.s, v.oy + (p.cell[1] + 0.5) * v.s, p.exclusionRadius * v.s, 0, 7);
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }
  if (S.ov.plc){
    for (const p of pls){
      const cx = v.ox + (p.cell[0] + 0.5) * v.s, cy = v.oy + (p.cell[1] + 0.5) * v.s;
      const r = clamp(v.s * 0.75, 5.5, 11);
      const seld = S.sel?.t === 'placement' && S.sel.id === p.id;
      const hov = S.hover?.pid === p.id;
      const col = p.locked ? '#ffd166' : (p.rule.startsWith('world_boss') ? '#ff7d9d' : '#6ac1ff');
      ctx.beginPath();
      if (p.rule.startsWith('world_boss')){ ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy); ctx.closePath(); }
      else ctx.rect(cx - r * 0.82, cy - r * 0.82, r * 1.64, r * 1.64);
      ctx.fillStyle = col; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = '#10131a'; ctx.stroke();
      if (p.locked){ /* padlock glyph */
        ctx.strokeStyle = '#332708'; ctx.fillStyle = '#332708'; ctx.lineWidth = Math.max(1, r * 0.16);
        ctx.beginPath(); ctx.arc(cx, cy - r * 0.12, r * 0.26, Math.PI, 0); ctx.stroke();
        ctx.fillRect(cx - r * 0.34, cy - r * 0.12, r * 0.68, r * 0.52);
      }
      if (seld || hov){
        ctx.beginPath(); ctx.arc(cx, cy, r + 3.5, 0, 7);
        ctx.strokeStyle = seld ? '#ffffff' : '#ffffff88'; ctx.lineWidth = seld ? 2 : 1.2; ctx.stroke();
      }
    }
  }
  if (S.hover){
    ctx.strokeStyle = '#ffffff80'; ctx.lineWidth = 1;
    ctx.strokeRect(v.ox + S.hover.cell[0] * v.s, v.oy + S.hover.cell[1] * v.s, v.s, v.s);
  }
  if (S.flash && Date.now() < S.flash.until){
    const [fx, fy] = S.flash.cell;
    const cx = v.ox + (fx + 0.5) * v.s, cy = v.oy + (fy + 0.5) * v.s;
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx, cy, 9, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - 13, cy); ctx.lineTo(cx + 13, cy); ctx.moveTo(cx, cy - 13); ctx.lineTo(cx, cy + 13); ctx.stroke();
    requestAnimationFrame(draw);
  }
}

/* map pointer interactions: hover to inspect, click to pin, drag pans (nothing on the map is movable) */
let ptr = null;
function evCell(e){
  const v = geo(), r = wrap.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left - v.ox) / v.s), y = Math.floor((e.clientY - r.top - v.oy) / v.s);
  return (x >= 0 && y >= 0 && x < D.W && y < D.H) ? [x, y] : null;
}
cv.addEventListener('pointermove', (e) => {
  if (!S.pack) return;
  if (ptr && ptr.drag){ S.view.px += e.clientX - ptr.x; S.view.py += e.clientY - ptr.y; ptr.x = e.clientX; ptr.y = e.clientY; draw(); return; }
  if (ptr && Math.hypot(e.clientX - ptr.x0, e.clientY - ptr.y0) > 4){ ptr.drag = true; cv.classList.add('panning'); ptr.x = e.clientX; ptr.y = e.clientY; return; }
  const c = evCell(e);
  const key = c ? c.join() : '';
  if (key !== (S.hover ? S.hover.cell.join() : '')){
    if (c){
      const idx = c[1] * D.W + c[0];
      S.hover = { cell: c, pid: D.plcMap.get(idx) || null, tid: D.terrMap.get(idx) || null };
    } else S.hover = null;
    renderInspect(); renderCursor(); draw();
  }
});
cv.addEventListener('pointerleave', () => { if (S.hover){ S.hover = null; renderInspect(); renderCursor(); draw(); } });
cv.addEventListener('pointerdown', (e) => { ptr = { x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, drag: false }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointerup', (e) => {
  const wasDrag = ptr && ptr.drag; ptr = null; cv.classList.remove('panning');
  if (wasDrag || !S.pack) return;
  const c = evCell(e); if (!c) return;
  const idx = c[1] * D.W + c[0];
  const pid = D.plcMap.get(idx), tid = D.terrMap.get(idx);
  S.sel = pid ? { t: 'placement', id: pid } : tid ? { t: 'territory', id: tid } : null;
  renderInspect(); draw();
});
cv.addEventListener('wheel', (e) => {
  if (!S.pack) return; e.preventDefault();
  const v = geo(), r = wrap.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const wx = (mx - v.ox) / v.s, wy = (my - v.oy) / v.s;
  const m2 = clamp(S.view.m * Math.exp(-e.deltaY * 0.0016), 1, 14);
  const s2 = v.s0 * m2;
  S.view.px = mx - wx * s2 - (v.cw - D.W * s2) / 2;
  S.view.py = my - wy * s2 - (v.ch - D.H * s2) / 2;
  S.view.m = m2; draw();
}, { passive: false });
document.querySelectorAll('[data-zoom]').forEach((b) => b.addEventListener('click', () => {
  const z = b.dataset.zoom;
  if (z === 'fit'){ S.view = { m: 1, px: 0, py: 0 }; }
  else S.view.m = clamp(S.view.m * (z === 'in' ? 1.5 : 1 / 1.5), 1, 14);
  draw();
}));
addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sel){ S.sel = null; renderInspect(); draw(); } });

/* ============================ rail / worlds ============================ */
function renderWorlds(){
  $('worlds').innerHTML = S.worlds.map((w) => {
    const pend = (S.pending[w.name] || []).length;
    return `<div class="world ${w.name === S.world ? 'on' : ''}" data-world="${esc(w.name)}" role="button" tabindex="0">
      <div class="nm">${esc(w.name)}${pend ? `<span class="pend" title="${pend} recipe change(s) pending"></span>` : ''}</div>
      <div class="meta">${w.width}×${w.height} · ${esc(w.source)}
        ${w.hasOwnRecipe ? '<span class="tag own">own recipe</span>' : ''}
        ${w.hasExport ? '<span class="tag exp">exported</span>' : ''}</div>
    </div>`;
  }).join('') || '<div class="hintline" style="padding:8px">no worlds found</div>';
}
$('worlds').addEventListener('click', (e) => {
  const el = e.target.closest('[data-world]');
  if (el && !S.busy) selectWorld(el.dataset.world);
});
$('worlds').addEventListener('keydown', (e) => {
  const el = e.target.closest('[data-world]');
  if (el && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); if (!S.busy) selectWorld(el.dataset.world); }
});

async function refreshWorlds(){
  try {
    const data = await api('GET', '/api/worlds');
    S.worlds = data.worlds; renderWorlds();
  } catch (err){ setMsg('direct', err.message, 'bad'); renderDirectOut(); }
}
async function selectWorld(name){
  S.world = name; S.sel = null; S.hover = null; S.pack = null; S.packErr = null;
  S.recipe = null; S.draft = null; S.recipeDirty = false; S.rawMode = false;
  S.msgs = {}; S.view = { m: 1, px: 0, py: 0 };
  renderWorlds(); renderDirectOut(); renderAll();
  $('viewlink').classList.toggle('hidden', S.mode === 'mock' || !name);
  $('viewlink').href = '/view?world=' + encodeURIComponent(name);
  await Promise.all([loadPack(), loadRecipe()]);
}
async function loadPack(){
  const w = S.world;
  try {
    const pack = await api('GET', `/api/pack?world=${encodeURIComponent(w)}`);
    if (S.world !== w) return;
    S.pack = pack; S.packErr = null; derivePack();
  } catch (err){
    if (S.world !== w) return;
    S.pack = null; S.packErr = err.message;
  }
  renderAll(); draw();
}
async function loadRecipe(){
  const w = S.world;
  try {
    const r = await api('GET', `/api/recipe?world=${encodeURIComponent(w)}`);
    if (S.world !== w) return;
    S.recipe = r; S.draft = deep(r.normalized); S.recipeDirty = false;
  } catch (err){
    if (S.world !== w) return;
    S.recipe = null; S.draft = null; setMsg('recipe', err.message, 'bad');
  }
  renderRecipe(); renderInspect();
}

/* ============================== verbs ============================== */
function setBusy(on){
  S.busy = on; document.body.classList.toggle('busy', on);
  $('busy').classList.toggle('hidden', !on);
  $('busyT1').textContent = `Directing ${S.world}…`;
  renderEmpty();
}
async function doDirect(){
  if (!S.world || S.busy) return;
  setBusy(true); setMsg('direct', '', 'good'); delete S.msgs.direct; renderDirectOut();
  try {
    const strict = $('strict').checked;
    const res = await api('POST', `/api/direct?world=${encodeURIComponent(S.world)}${strict ? '&strict=1' : ''}`);
    S.gen++;
    S.pending[S.world] = [];
    const c = res.counts;
    setMsg('direct', `ok — ${c.placements} placements · ${c.territories} territories · ` +
      `${c.placementFailures + c.territoryFailures} failures · ${c.unboundAnchors} unbound anchors`, 'good');
    S.lastGates = res.gates;
    await Promise.all([refreshWorlds(), loadPack(), loadRecipe()]);
  } catch (err){
    setMsg('direct', err.message, 'bad'); S.lastGates = null;
  }
  setBusy(false); renderDirectOut(); renderStale(); renderWorlds();
}
$('btnDirect').addEventListener('click', doDirect);

function renderDirectOut(){
  const g = S.lastGates;
  $('directOut').innerHTML = msgSlot('direct') + (g ? `<div class="gates">${g.map((x) =>
    `<span class="chip ${esc(x.status)}" title="${esc(x.name)}: ${esc(x.status)}">${esc(x.id)}</span>`).join('')}</div>` : '');
}

async function doLock(id, verb){
  try {
    const res = await api('POST', '/api/' + verb, { world: S.world, placementId: id });
    const receipt = verb === 'lock' ? `locked ${res.locked?.id ?? id}` : `unlocked ${res.released ?? id}`;
    pendList().push(receipt);
    setMsg('plc:' + id, receipt + ' — saved to the recipe. Direct to apply.', 'note');
    await Promise.all([refreshWorlds(), loadRecipe()]);
  } catch (err){ setMsg('plc:' + id, err.message, 'bad'); }
  renderAll();
}
async function doReroll(rid){
  try {
    const res = await api('POST', '/api/reroll', { world: S.world, regionId: rid });
    const receipt = `reroll ${res.regionId} → iteration ${res.iteration}`;
    pendList().push(receipt);
    setMsg('reg:' + rid, receipt + ' — saved to the recipe. Direct to apply.', 'note');
    await Promise.all([refreshWorlds(), loadRecipe()]);
  } catch (err){ setMsg('reg:' + rid, err.message, 'bad'); }
  renderAll();
}

/* ====================== stale banner / empty state ====================== */
function renderStale(){
  const list = pendList();
  const el = $('stale');
  if (!S.world || list.length === 0){ el.classList.add('hidden'); el.innerHTML = ''; return; }
  el.classList.remove('hidden');
  el.innerHTML = `<div class="bar">
      <span>◍ ${list.length} recipe change${list.length > 1 ? 's' : ''} pending — the map shows the last export</span>
      <button class="btn small verb" data-act="direct">Direct to apply</button>
      <details style="margin-left:auto"><summary>show changes</summary></details>
    </div>
    <ul class="hidden">${list.map((s) => `<li>${esc(s)}</li>`).join('')}</ul>`;
  const det = el.querySelector('details'), ul = el.querySelector('ul');
  det.addEventListener('toggle', () => ul.classList.toggle('hidden', !det.open));
  el.querySelector('[data-act=direct]').addEventListener('click', doDirect);
}
function renderEmpty(){
  const el = $('mapempty');
  if (S.pack || S.busy){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  if (!S.world){ el.innerHTML = '<div class="hint">pick a world on the left</div>'; return; }
  el.innerHTML = `
    ${S.packErr ? `<div class="err-line">${esc(S.packErr)}</div>` : ''}
    <div class="hint">Direct runs generation + export for <span class="mono">${esc(S.world)}</span>:
      placements, territories, audit gates and the four map renders.</div>
    <button class="btn primary verb" data-act="direct">Direct ${esc(S.world)}</button>`;
  el.querySelector('[data-act=direct]')?.addEventListener('click', doDirect);
}

/* ============================ cursor bar ============================ */
function renderCursor(){
  const parts = [];
  if (S.hover){
    parts.push(`cell ${cellS(S.hover.cell)}`);
    if (S.hover.tid) parts.push(`<span class="cid">${esc(S.hover.tid)}</span>`);
    if (S.hover.pid) parts.push(`<span class="cid">${esc(S.hover.pid)}</span>`);
  } else if (S.sel) parts.push(`selected <span class="cid">${esc(S.sel.id)}</span> — esc to clear`);
  $('cursorbar').innerHTML = parts.join(' · ');
  const m = S.pack?.manifest;
  $('stamp').innerHTML = m ? `${esc(m.world)} · ${esc(m.recipeName)} · behavior ${esc(m.directorBehaviorVersion)} · ${esc(String(m.directorRecipeSha256).slice(0, 12))}…` : '';
}

/* ============================ inspector ============================ */
function kv(rows){
  return `<div class="kv">${rows.filter(Boolean).map(([k, v, left]) =>
    `<span class="k">${k}</span><span class="v ${left ? 'l' : ''}">${v}</span>`).join('')}</div>`;
}
const regionLink = (rid) => `<a href="#" data-act="sel-reg" data-id="${esc(rid)}">${esc(rid)}</a>`;

function plcCard(p, pinned){
  const kind = p.rule.startsWith('world_boss') ? 'boss' : 'dungeon';
  const col = p.locked ? 'var(--gold)' : kind === 'boss' ? 'var(--boss)' : 'var(--dun)';
  const inRecipe = recipeLockIds().has(p.id); // the verb edits the recipe, so the button follows it
  let scoreBlock;
  if (p.locked){
    scoreBlock = `<div class="sent">held by recipe lock<div class="cap">scores are not computed for locked placements — unlock to re-score on the next direct</div></div>`;
  } else {
    scoreBlock = `
    <table class="t"><tr><th>term</th><th class="r">value</th><th class="r">weight ‰</th><th class="r">→</th></tr>
      ${p.scoreTerms.map((s) => `<tr><td>${esc(s.term)}</td><td class="r">${esc(s.value)}</td><td class="r">${esc(s.weightPermille)}</td><td class="r">${esc(s.contribution)}</td></tr>`).join('')}
      <tr class="tot"><td>score</td><td></td><td></td><td class="r">${esc(p.score)}</td></tr></table>
    <div class="subh">candidate funnel</div>
    <div class="funnel">${(() => {
      const max = Math.max(1, ...(p.candidateFunnel.map((f) => f.remaining)));
      return p.candidateFunnel.map((f) => `<div class="fr"><span>${esc(f.stage)}</span><span class="r" style="text-align:right">${esc(f.remaining)}</span></div>
        <div class="fbar"><i style="width:${(f.remaining / max) * 100}%"></i></div>`).join('');
    })()}</div>
    <div class="subh">top candidates</div>
    <div class="cands">${p.topCandidates.map((c) => `<span class="chip" data-act="flash" data-cell="${c.cell[0]},${c.cell[1]}" title="flash on map">${cellS(c.cell)} · ${esc(c.score)}</span>`).join('')}</div>`;
  }
  return `<div class="card">
    <div class="chiprow">
      <span class="chip"><span class="dot" style="background:${col};${kind === 'boss' ? 'transform:rotate(45deg)' : ''}"></span>${esc(p.rule)}</span>
      ${p.locked ? '<span class="chip gold">locked</span>' : ''}
      ${inRecipe && !p.locked ? '<span class="chip warn">lock pending — Direct to apply</span>' : ''}
      ${!inRecipe && p.locked ? '<span class="chip warn">unlock pending — Direct to apply</span>' : ''}
      ${p.inSafeZone ? '<span class="chip warn">in safe zone</span>' : ''}
      ${pinned ? '<button class="xbtn" data-act="desel" title="deselect (esc)">✕</button>' : '<span class="chip" style="margin-left:auto">hover — click to pin</span>'}
    </div>
    <h3>${esc(p.id)}</h3>
    ${kv([
      ['cell', esc(cellS(p.cell))], ['access', esc(cellS(p.accessCell))],
      ['region', regionLink(p.regionId)],
      ['anchor', p.anchorPoiId === null ? '—' : `${esc(p.anchorPoiType)} #${esc(p.anchorPoiId)}`],
      ['arena', p.arenaOrigin ? `${esc(cellS(p.arenaOrigin))} side ${esc(p.arenaSide)}` : '—'],
      ['exclusion', esc(p.exclusionRadius) + ' cells'],
      ['channel', esc(p.channel)], ['draw', esc(p.draw)],
    ])}
    ${scoreBlock}
    <div class="actions">
      <button class="btn verb" data-act="${inRecipe ? 'unlock' : 'lock'}" data-id="${esc(p.id)}">${inRecipe ? 'Unlock' : 'Lock'} placement</button>
      <span class="hintline" style="margin:0">${inRecipe ? 'removes the lock from the recipe' : 'pins this exact placement in the recipe'}</span>
    </div>
    ${msgSlot('plc:' + p.id)}
  </div>`;
}

function regCard(r, pinned){
  const cov = D.covByRegion[r.id];
  const target = S.recipe?.normalized?.territoryRule?.targetHostileCoveragePermille ?? 350;
  const plcs = S.pack.placements.placements.filter((p) => p.regionId === r.id);
  const terrs = S.pack.territories.territories.filter((t) => t.regionId === r.id);
  const it = rerollIter(r.id);
  return `<div class="card">
    <div class="chiprow">
      <span class="chip acc">region</span>
      <span class="chip">${esc(r.biome)}</span>
      ${bandChip(r.dangerBand)}
      <span class="chip">${esc(r.regionClass)}</span>
      ${pinned ? '<button class="xbtn" data-act="desel" title="deselect (esc)">✕</button>' : ''}
    </div>
    <h3>${esc(r.id)}</h3>
    ${kv([
      ['cells', esc(r.cellCount)],
      ['hostile walkable', esc(r.hostileWalkableCells)],
      ['budgets', `T ${esc(r.budgets.territories)} · E ${esc(r.budgets.encounterSites)} · D ${esc(r.budgets.dungeonBindings)} · B ${esc(r.budgets.worldBosses)}`],
      r.waivers?.length ? ['waivers', r.waivers.map((w) => `<span class="chip warn">${esc(w)}</span>`).join(' ')] : null,
      cov ? ['coverage', `${esc(cov.covered)}/${esc(cov.hostileWalkable)} · ${esc(cov.coveragePermille)} ‰ (target ${esc(target)} ‰)`] : null,
    ])}
    ${plcs.length ? `<div class="subh">placements here</div><div class="rowlist">${plcs.map((p) =>
      `<div class="rowitem" data-act="sel-plc" data-id="${esc(p.id)}"><span style="color:${p.locked ? 'var(--gold)' : p.rule.startsWith('world_boss') ? 'var(--boss)' : 'var(--dun)'}">${p.rule.startsWith('world_boss') ? '◆' : '■'}</span><span class="grow">${esc(p.id)}</span><span class="sub">${esc(cellS(p.cell))}</span></div>`).join('')}</div>` : ''}
    ${terrs.length ? `<div class="subh">territories here</div><div class="rowlist">${terrs.map((t) =>
      `<div class="rowitem" data-act="sel-terr" data-id="${esc(t.id)}"><span class="dot" style="width:8px;height:8px;border-radius:2px;background:${D.tColors[t.id]};flex:none"></span><span class="grow">${esc(t.id)}</span><span class="sub">${esc(t.cellCount)} cells</span></div>`).join('')}</div>` : ''}
    <div class="actions">
      <button class="btn verb" data-act="reroll" data-id="${esc(r.id)}">Reroll region</button>
      <span class="hintline" style="margin:0">reroll iteration: ${esc(it)} — bumps this region's random draw</span>
    </div>
    ${msgSlot('reg:' + r.id)}
  </div>`;
}
function overviewCard(){
  const m = S.pack.manifest, c = m.counts, wb = S.pack.plan.worldBudget;
  const target = S.recipe?.normalized?.territoryRule?.targetHostileCoveragePermille ?? 350;
  const warns = S.pack.plan.checks?.progressionWarnings || [];
  return `<div class="card">
    <div class="chiprow"><span class="chip acc">${esc(m.world)}</span><span class="chip">${esc(m.recipeName)}</span></div>
    ${kv([
      ['placements', esc(c.placements)], ['territories', esc(c.territories)],
      ['failures', esc(c.placementFailures + c.territoryFailures)],
      ['unbound anchors', esc(c.unboundAnchors)],
      ['world budget', `T ${esc(wb.territories)} · E ${esc(wb.encounterSites)} · D ${esc(wb.dungeonBindings)} · B ${esc(wb.worldBosses.allocated)}/${esc(wb.worldBosses.target)}`],
      ['spawn region', regionLink(S.pack.plan.spawnRegionId)],
    ])}
    ${warns.length ? `<div class="msg note">${warns.map(esc).join('\n')}</div>` : ''}
    <div class="subh">budgeted regions — reroll what you don't like</div>
    <div class="rowlist">${D.budgeted.map((r) => {
      const cov = D.covByRegion[r.id];
      return `<div class="rowitem" data-act="sel-reg" data-id="${esc(r.id)}">
        <span class="grow">${esc(r.id)}</span>
        ${cov ? `<span class="covbar" title="${esc(cov.coveragePermille)} ‰ of ${esc(cov.hostileWalkable)} hostile cells covered (target ${esc(target)} ‰)"><i style="width:${clamp(cov.coveragePermille / 10, 0, 100)}%"></i><b style="left:${clamp(target / 10, 0, 100)}%"></b></span>` : ''}
        ${bandChip(r.dangerBand)}
        <button class="btn small verb" data-act="reroll" data-id="${esc(r.id)}" title="bump this region's random draw">reroll</button>
      </div>${S.msgs['reg:' + r.id] ? `<div style="padding:0 7px">${msgSlot('reg:' + r.id)}</div>` : ''}`;
    }).join('')}</div>
    <div class="hintline">hover the map to inspect a cell — click a marker or territory to pin it here</div>
  </div>`;
}
function renderInspect(){
  const ctx = $('inspectCtx'), body = $('inspectBody');
  if (!S.pack){
    ctx.textContent = '';
    body.innerHTML = `<div class="hintline">${S.world ? 'nothing to inspect — no export yet. Direct the world first.' : 'pick a world to begin.'}</div>`;
    return;
  }
  const hov = S.hover && (S.hover.pid || S.hover.tid);
  if (hov){
    ctx.innerHTML = '<span class="chip">hovering</span>';
    body.innerHTML = S.hover.pid ? plcCard(getPlc(S.hover.pid), false) : terrCard(getTerr(S.hover.tid), false);
    return;
  }
  if (S.hover){
    ctx.innerHTML = '<span class="chip">hovering</span>';
    body.innerHTML = `<div class="hintline mono">cell ${esc(cellS(S.hover.cell))} — no placement or territory here</div>` +
      (S.sel ? '' : overviewMaybe());
    if (S.sel) body.innerHTML += selCard();
    return;
  }
  if (S.sel){ ctx.innerHTML = '<span class="chip acc">selected</span>'; body.innerHTML = selCard(); return; }
  ctx.innerHTML = '<span class="chip">world overview</span>';
  body.innerHTML = overviewCard();
}
const overviewMaybe = () => overviewCard();
function selCard(){
  if (S.sel.t === 'placement'){ const p = getPlc(S.sel.id); if (p) return plcCard(p, true); }
  if (S.sel.t === 'territory'){ const t = getTerr(S.sel.id); if (t) return terrCard(t, true); }
  if (S.sel.t === 'region'){ const r = getReg(S.sel.id); if (r) return regCard(r, true); }
  S.sel = null; return overviewCard();
}
$('side').addEventListener('click', async (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === 'sel-reg'){ e.preventDefault(); S.sel = { t: 'region', id }; renderInspect(); draw(); }
  else if (act === 'sel-plc'){ S.sel = { t: 'placement', id }; renderInspect(); draw(); }
  else if (act === 'sel-terr'){ S.sel = { t: 'territory', id }; renderInspect(); draw(); }
  else if (act === 'desel'){ S.sel = null; renderInspect(); draw(); }
  else if (act === 'lock' || act === 'unlock') doLock(id, act);
  else if (act === 'reroll') doReroll(id);
  else if (act === 'flash'){
    const [x, y] = el.dataset.cell.split(',').map(Number);
    S.flash = { cell: [x, y], until: Date.now() + 1400 }; draw();
  }
});

/* ============================== audit ============================== */
function renderAudit(){
  const body = $('auditBody');
  if (!S.pack){ body.innerHTML = '<div class="hintline">audit report appears after the first direct.</div>'; return; }
  const rep = S.pack.report;
  const pf = S.pack.placements.failures || [], tf = S.pack.territories.failures || [];
  const ub = S.pack.placements.unboundAnchors || [];
  const byReason = {};
  for (const u of ub) (byReason[u.reason] = byReason[u.reason] || []).push(u);
  body.innerHTML = `
    <div class="chiprow">
      <span class="chip ${rep.ok ? 'pass' : 'fail'}">${rep.ok ? 'report ok' : 'report failed'}</span>
      <span class="chip">${rep.strict ? 'strict' : 'non-strict'}</span>
      <span class="chip">${esc(rep.recipeName)}</span>
    </div>
    <div class="subh">gates</div>
    ${rep.gates.map((g) => `<div class="gaterow"><span class="gid">${esc(g.id)}</span><span class="gnm">${esc(g.name)}</span><span class="chip ${esc(g.status)}">${esc(g.status)}</span></div>
      ${(g.details && g.details.length) ? `<div class="gatedet">${g.details.map((d) => esc(typeof d === 'string' ? d : JSON.stringify(d))).join('\n')}</div>` : ''}`).join('')}
    <div class="subh">failures</div>
    ${pf.length + tf.length === 0 ? '<div class="hintline" style="margin-top:2px">none — every budget placed</div>'
      : [...pf, ...tf].map((f) => `<div class="msg bad">${esc(typeof f === 'string' ? f : JSON.stringify(f))}</div>`).join('')}
    <div class="subh">unbound anchors (${ub.length})</div>
    ${Object.entries(byReason).map(([reason, list]) => `
      <details><summary class="mono" style="cursor:pointer;color:var(--mut);font-size:12px">${esc(reason)} × ${list.length}</summary>
      ${list.map((u) => `<div class="gaterow"><span class="gnm">${esc(u.poiType)} #${esc(u.poiId)} at ${esc(cellS(u.cell))}</span><a href="#" data-act="sel-reg" data-id="${esc(u.regionId)}" class="mono" style="font-size:11px">${esc(u.regionId)}</a></div>`).join('')}
      </details>`).join('') || '<div class="hintline" style="margin-top:2px">none</div>'}
  `;
}

/* ============================== recipe ============================== */
const NUM_FIELDS = {
  danger: [['bandCount', 'band count'], ['maxBandJump', 'max band jump'], ['safeZoneShareForBand0Permille', 'safe share, band 0 ‰']],
  budgets: [['minRegionCells', 'min region cells'], ['majorRegionCells', 'major region cells'],
    ['territoriesPer1000Walkable', 'territories / 1000 walkable'], ['territoryCapPerRegion', 'territory cap / region'],
    ['encountersPer1000Walkable', 'encounters / 1000 walkable'], ['encounterCapPerRegion', 'encounter cap / region'],
    ['dungeonCapPerRegion', 'dungeon cap / region'], ['worldBossCount', 'world boss count'], ['minWorldBossBand', 'min world boss band']],
  worldBossRule: [['minClearance', 'min clearance'], ['minSettlementPathDistance', 'min settlement path dist'],
    ['minPeerPathDistance', 'min peer path dist'], ['exclusionRadius', 'exclusion radius'],
    ['clearancePermille', 'clearance weight ‰'], ['settlementFarPermille', 'settlement-far weight ‰'], ['roadFarPermille', 'road-far weight ‰']],
  dungeonRule: [['exclusionRadius', 'exclusion radius'], ['settlementFarPermille', 'settlement-far weight ‰']],
  territoryRule: [['targetHostileCoveragePermille', 'target hostile coverage ‰'], ['minCells', 'min cells'], ['maxCells', 'max cells'],
    ['packSizeMin', 'pack size min'], ['packSizeMax', 'pack size max'], ['maxActivePer100Cells', 'max active / 100 cells'],
    ['elitePermille', 'elite ‰']],
};
function numRow(group, key, label){
  const v = S.draft?.[group]?.[key];
  return `<label for="rf-${group}-${key}">${esc(label)}</label>
    <input id="rf-${group}-${key}" type="number" data-path="${group}.${key}" value="${v === undefined ? '' : esc(v)}">`;
}
function renderRecipe(){
  const body = $('recipeBody');
  if (!S.recipe || !S.draft){
    body.innerHTML = msgSlot('recipe') || '<div class="hintline">recipe loads when a world is selected.</div>';
    return;
  }
  const r = S.recipe, d = S.draft;
  const locksN = d.locks?.placements?.length ?? 0;
  const rollsN = d.rerolls?.length ?? 0;
  const paintN = (d.paint?.noContent?.length ?? 0) + (d.paint?.preferContent?.length ?? 0);
  const head = `
    <div class="chiprow">
      <span class="chip ${r.own ? 'gold' : ''}">${r.own ? 'own recipe' : 'example recipe'}</span>
      <span class="dirty ${S.recipeDirty ? '' : 'hidden'}" id="dirtyChip">unsaved edits</span>
      <button class="btn small" id="rawToggle" style="margin-left:auto">${S.rawMode ? 'form' : 'raw JSON'}</button>
    </div>
    <div class="hintline mono" style="margin-top:4px;word-break:break-all">${esc(r.path)}</div>
    ${r.own ? '' : '<div class="hintline">saving creates this world\'s own recipe file</div>'}`;
  if (S.rawMode){
    body.innerHTML = head + `
      <div id="rawwrap" style="margin-top:8px"><textarea id="rawTa" spellcheck="false">${esc(S.rawText ?? JSON.stringify(d, null, 2))}</textarea></div>
      <div class="rfoot"><button class="btn primary verb" id="saveRecipe">Validate + save</button>
        <span class="hintline" style="margin:0">the engine validates on save</span></div>
      ${msgSlot('recipe')}`;
  } else {
    body.innerHTML = head + `
      <div class="rgrid">
        <label for="rf-name">name</label><input id="rf-name" type="text" data-path="name" value="${esc(d.name ?? '')}">
        <label for="rf-seed">director seed</label><input id="rf-seed" type="number" data-path="directorSeed" value="${esc(d.directorSeed ?? '')}">
      </div>
      <div class="subh">danger</div><div class="rgrid">${NUM_FIELDS.danger.map(([k, l]) => numRow('danger', k, l)).join('')}</div>
      <div class="subh">budgets</div><div class="rgrid">${NUM_FIELDS.budgets.map(([k, l]) => numRow('budgets', k, l)).join('')}</div>
      <div class="subh">world boss rule</div><div class="rgrid">${NUM_FIELDS.worldBossRule.map(([k, l]) => numRow('worldBossRule', k, l)).join('')}</div>
      <div class="subh">dungeon rule</div><div class="rgrid">${NUM_FIELDS.dungeonRule.map(([k, l]) => numRow('dungeonRule', k, l)).join('')}</div>
      <div class="subh">territory rule</div><div class="rgrid">${NUM_FIELDS.territoryRule.map(([k, l]) => numRow('territoryRule', k, l)).join('')}
        <label for="rf-resp">respawn pressure</label>
        <select id="rf-resp" data-path="territoryRule.respawnPressure">
          ${['low', 'medium', 'high'].map((o) => `<option ${d.territoryRule?.respawnPressure === o ? 'selected' : ''}>${o}</option>`).join('')}
        </select>
      </div>
      <div class="subh">dungeon anchor poi types</div>
      <textarea data-path="dungeonAnchors.poiTypes" data-kind="lines" rows="4" spellcheck="false">${esc((d.dungeonAnchors?.poiTypes || []).join('\n'))}</textarea>
      <div class="subh">enemy library</div>
      <table class="enemies"><tr><th>id</th><th class="bio">biomes (comma)</th><th>band</th><th></th><th>wt %</th><th>night</th><th></th></tr>
        ${(d.contentLibrary?.enemies || []).map((en, i) => `<tr>
          <td><input type="text" data-path="contentLibrary.enemies.${i}.id" value="${esc(en.id)}"></td>
          <td class="bio"><input type="text" data-path="contentLibrary.enemies.${i}.biomes" data-kind="csv" value="${esc((en.biomes || []).join(', '))}"></td>
          <td><input type="number" data-path="contentLibrary.enemies.${i}.minBand" value="${esc(en.minBand)}" title="min band"></td>
          <td><input type="number" data-path="contentLibrary.enemies.${i}.maxBand" value="${esc(en.maxBand)}" title="max band"></td>
          <td><input type="number" data-path="contentLibrary.enemies.${i}.weightPercent" value="${esc(en.weightPercent)}"></td>
          <td><input type="checkbox" data-path="contentLibrary.enemies.${i}.nightOnly" data-kind="bool" ${en.nightOnly ? 'checked' : ''}></td>
          <td><button class="xbtn" data-ract="delEnemy" data-i="${i}" title="remove">✕</button></td></tr>`).join('')}
      </table>
      <button class="btn small" data-ract="addEnemy">+ add enemy</button>
      <div class="chiprow" style="margin-top:12px">
        <span class="chip" title="managed by the Lock/Unlock verbs">locks: ${locksN}</span>
        <span class="chip" title="managed by the Reroll verb">rerolls: ${rollsN}</span>
        <span class="chip" title="painted zones — edited outside this studio">paint zones: ${paintN}</span>
        ${(d.danger?.overrides?.length ?? 0) ? `<span class="chip" title="edit via raw JSON">danger overrides: ${d.danger.overrides.length}</span>` : ''}
      </div>
      <div class="rfoot">
        <button class="btn primary verb" id="saveRecipe">Validate + save</button>
        <span class="hintline" style="margin:0">the engine validates on save</span>
      </div>
      ${msgSlot('recipe')}`;
  }
  $('rawToggle')?.addEventListener('click', toggleRaw);
  $('saveRecipe')?.addEventListener('click', saveRecipe);
}
function setPath(obj, path, val){
  const ks = path.split('.'); let t = obj;
  for (let i = 0; i < ks.length - 1; i++) t = t[ks[i]] ?? (t[ks[i]] = {});
  t[ks[ks.length - 1]] = val;
}
$('recipeBody').addEventListener('change', (e) => {
  const el = e.target;
  if (el.id === 'rawTa'){ S.rawText = el.value; S.recipeDirty = true; return; }
  const path = el.dataset.path; if (!path) return;
  let v;
  if (el.dataset.kind === 'bool') v = el.checked;
  else if (el.dataset.kind === 'lines') v = el.value.split('\n').map((s) => s.trim()).filter(Boolean);
  else if (el.dataset.kind === 'csv') v = el.value.split(',').map((s) => s.trim()).filter(Boolean);
  else if (el.type === 'number'){ const s = el.value.trim(); v = s === '' ? '' : (isFinite(+s) ? +s : s); }
  else v = el.value;
  setPath(S.draft, path, v);
  if (!S.recipeDirty){ S.recipeDirty = true; $('dirtyChip')?.classList.remove('hidden'); }
});
$('recipeBody').addEventListener('click', (e) => {
  const el = e.target.closest('[data-ract]'); if (!el) return;
  if (el.dataset.ract === 'addEnemy'){
    (S.draft.contentLibrary ?? (S.draft.contentLibrary = { enemies: [] })).enemies.push(
      { id: 'enemy.', biomes: [], minBand: 0, maxBand: 15, weightPercent: 20, nightOnly: false });
    S.recipeDirty = true; renderRecipe();
  }
  if (el.dataset.ract === 'delEnemy'){
    S.draft.contentLibrary.enemies.splice(+el.dataset.i, 1);
    S.recipeDirty = true; renderRecipe();
  }
});
function toggleRaw(){
  if (!S.rawMode){ S.rawText = JSON.stringify(S.draft, null, 2); S.rawMode = true; }
  else {
    try { S.draft = JSON.parse(S.rawText ?? ''); delete S.msgs.recipe; }
    catch (err){ setMsg('recipe', 'not valid JSON — ' + err.message, 'bad'); renderRecipe(); return; }
    S.rawMode = false;
  }
  renderRecipe();
}
async function saveRecipe(){
  let bodyObj;
  if (S.rawMode){
    try { bodyObj = JSON.parse($('rawTa').value); }
    catch (err){ setMsg('recipe', 'not valid JSON — ' + err.message, 'bad'); renderRecipe(); return; }
  } else bodyObj = S.draft;
  try {
    await api('PUT', `/api/recipe?world=${encodeURIComponent(S.world)}`, bodyObj);
    pendList().push('recipe saved');
    setMsg('recipe', 'saved — Direct to apply.', 'note');
    S.recipeDirty = false; S.rawMode = false; S.rawText = null;
    await Promise.all([refreshWorlds(), loadRecipe()]);
  } catch (err){ setMsg('recipe', err.message, 'bad'); }
  renderRecipe(); renderStale(); renderWorlds();
}

/* ======================== map controls wiring ======================== */
$('backdropSeg').innerHTML = BACKDROPS.map((b) =>
  `<button data-bd="${b}" aria-pressed="${b === S.backdrop}">${b}</button>`).join('');
$('backdropSeg').addEventListener('click', (e) => {
  const b = e.target.closest('[data-bd]'); if (!b) return;
  S.backdrop = b.dataset.bd;
  document.querySelectorAll('#backdropSeg button').forEach((x) => x.setAttribute('aria-pressed', x.dataset.bd === S.backdrop));
  draw();
});
$('ovs').addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.ov){ S.ov[el.dataset.ov] = el.checked; draw(); }
});
$('alpha').addEventListener('input', () => { S.alpha = +$('alpha').value / 100; draw(); });

/* ============================== boot ============================== */
function renderAll(){
  renderStale(); renderEmpty(); renderInspect(); renderAudit(); renderRecipe(); renderCursor(); draw();
}
async function boot(){
  let live = false;
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 1600);
    const res = await fetch('/api/worlds', { signal: ctl.signal });
    clearTimeout(t);
    if (res.ok){ const j = await res.json(); if (j && Array.isArray(j.worlds)) live = true; }
  } catch { /* fall through to demo */ }
  S.mode = live ? 'live' : 'mock';
  const mc = $('modechip');
  mc.className = live ? 'live' : 'mock';
  mc.innerHTML = live
    ? '<span class="led" style="background:var(--green)"></span>live — wf-fill serve'
    : '<span class="led" style="background:var(--amber)"></span><span title="The wf-fill server was not reachable, so this session replays the captured sample responses (fen-hollow). Every action works; directs replay the same captured result.">demo data — server not reachable</span>';
  await refreshWorlds();
  if (S.worlds.length) await selectWorld(S.worlds[0].name);
  else renderAll();
}
boot();
</script>
